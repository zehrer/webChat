<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P2P Chat</title>
<style>
  body { font: 15px system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; }
  form { display: flex; gap: 8px; margin: 8px 0; }
  input { flex: 1; padding: 8px; font: inherit; }
  button { padding: 8px 14px; font: inherit; }
  #log { height: 60vh; overflow-y: auto; border: 1px solid #ccc; padding: 8px; }
  #log div { margin: 2px 0; }
  .sys { color: #888; font-style: italic; }
  .me b { color: #06c; }
  #peers { font: 13px ui-monospace, monospace; color: #555; margin: 0 0 8px; }
  [hidden] { display: none !important; }
  footer { margin-top: 16px; font-size: 13px; color: #555; }
  footer summary { cursor: pointer; }
  #debug { font: 12px ui-monospace, monospace; max-height: 30vh; overflow-y: auto; background: #f5f5f5; padding: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>P2P Chat</h1>

<form id="join">
  <input id="nick" placeholder="Dein Name" required>
  <button>Beitreten</button>
</form>

<div id="chat" hidden>
  <p id="status"></p>
  <pre id="peers"></pre>
  <div id="log"></div>
  <form id="send">
    <input id="text" placeholder="Nachricht…" autocomplete="off" required>
    <button>Senden</button>
  </form>
</div>

<footer>
  <details>
    <summary>Log</summary>
    <pre id="debug"></pre>
    <button id="copyLog">Log kopieren</button>
  </details>
</footer>

<script type="module">
import { joinRoom, selfId, createEvent, subscribe } from 'https://cdn.jsdelivr.net/npm/trystero@0.26.0/+esm'

const params = new URLSearchParams(location.search)
const ROOM = params.get('room') ?? 'lobby'
const ONLY_NOSTR = params.has('nostr')   // Test: WebRTC aus, alles über Nostr
// TURN-Relay für Peers, die sich nicht direkt verbinden können (z. B. Mobilfunk-NAT)
const TURN = [
  // { urls: ['turn:…:3478', 'turns:…:443?transport=tcp'], username: '…', credential: '…' }
]
// Fallback: Nachrichten über öffentliche Nostr-Relays, wenn WebRTC nicht klappt
const RELAYS = ['wss://nos.lol', 'wss://relay.damus.io', 'wss://relay.primal.net', 'wss://nostr.mom']
const TOPIC = `webchat-poc/${ROOM}/fallback`

const $ = id => document.getElementById(id)
const names = {}      // peerId -> Name
const nostrSeen = {}  // peerId -> Zeitpunkt des letzten Lebenszeichens über Nostr
const seenIds = new Set()
const eventIds = new Set()   // schon verarbeitete Nostr-Events
const paths = {}      // peerId -> zuletzt geloggter Verbindungsweg
let room, msg, hello, myName, sockets = []

// Technisches Log in der aufklappbaren Fußzeile
function dbg(text) {
  const el = $('debug')
  el.textContent += `${new Date().toLocaleTimeString()} ${text}\n`
  el.scrollTop = el.scrollHeight
}
window.onerror = (m) => dbg(`Fehler: ${m}`)
window.onunhandledrejection = e => dbg(`Fehler: ${e.reason}`)
$('copyLog').onclick = () => navigator.clipboard.writeText($('debug').textContent)

function log(text, cls) {
  const div = document.createElement('div')
  if (cls) div.className = cls
  if (typeof text === 'string') div.textContent = text
  else { const b = document.createElement('b'); b.textContent = text[0] + ': '; div.append(b, text[1]) }
  $('log').append(div)
  $('log').scrollTop = $('log').scrollHeight
}

function addPeer(id, name) {
  if (!(id in names)) log(`${name} ist beigetreten`, 'sys')
  names[id] = String(name)
}

function receive({ id, text }, peerId, via) {
  if (seenIds.has(id)) return dbg(`Nachricht von ${names[peerId] ?? peerId} über ${via}: schon erhalten, ignoriert`)
  seenIds.add(id)
  dbg(`Nachricht von ${names[peerId] ?? peerId} über ${via} empfangen`)
  log([names[peerId] ?? peerId, String(text)])
}

// --- Nostr: einfache verschlüsselte Nachrichten über Relays ---
// Schlüssel aus dem Raum abgeleitet: hält Relay-Betreiber fern, ist aber kein echtes Geheimnis
const key = crypto.subtle.digest('SHA-256', new TextEncoder().encode(TOPIC))
  .then(h => crypto.subtle.importKey('raw', h, 'AES-GCM', false, ['encrypt', 'decrypt']))

async function encrypt(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12))
  const data = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await key, new TextEncoder().encode(JSON.stringify(obj)))
  return btoa(String.fromCharCode(...iv, ...new Uint8Array(data)))
}

async function decrypt(str) {
  const bytes = Uint8Array.from(atob(str), c => c.charCodeAt(0))
  const data = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(0, 12) }, await key, bytes.slice(12))
  return JSON.parse(new TextDecoder().decode(data))
}

function connectRelay(url) {
  const relay = {}
  const open = () => {
    relay.ws = new WebSocket(url)
    relay.ws.onopen = () => { dbg(`Relay ${url} verbunden`); relay.ws.send(subscribe('webchat', TOPIC)) }
    relay.ws.onmessage = async e => {
      const [type, , event] = JSON.parse(e.data)
      if (type === 'EVENT') {
        if (eventIds.has(event.id)) return   // dasselbe Event von einem weiteren Relay
        eventIds.add(event.id)
        try { onNostr(await decrypt(event.content)) } catch {}
      } else if (type === 'NOTICE' || type === 'CLOSED' || (type === 'OK' && event === false)) dbg(`Relay ${url}: ${e.data}`)
    }
    relay.ws.onclose = e => { dbg(`Relay ${url} getrennt (Code ${e.code}), neuer Versuch in 5 s`); setTimeout(open, 5000) }
  }
  open()
  return relay
}

async function nostrSend(obj) {
  const event = await createEvent(TOPIC, await encrypt({ ...obj, from: selfId, name: myName }))
  const open = sockets.filter(r => r.ws.readyState === 1)
  open.forEach(r => r.ws.send(event))
  if (obj.t === 'msg') dbg(`Nachricht über Nostr an ${open.length} Relay(s) gesendet`)
}

function onNostr(m) {
  if (m.from === selfId) return
  if (!nostrSeen[m.from]) dbg(`Nostr: erstes Lebenszeichen von ${m.name} (${m.from})`)
  nostrSeen[m.from] = Date.now()
  addPeer(m.from, m.name)
  if (m.t === 'msg') receive(m, m.from, 'Nostr')
}

// --- Verbindungsstatus pro Peer ---
async function pathOf(pc) {
  const stats = [...(await pc.getStats()).values()]
  const pair = stats.find(s => s.type === 'candidate-pair' && s.nominated && s.state === 'succeeded')
  const local = pair && stats.find(s => s.id === pair.localCandidateId)
  const remote = pair && stats.find(s => s.id === pair.remoteCandidateId)
  if (!local) return 'WebRTC'
  if (local.candidateType === 'relay' || remote?.candidateType === 'relay') return 'WebRTC über TURN'
  // Browser verbergen lokale Adressen oft (leer oder *.local)
  const ip = [remote?.address, local.address].find(a => a && !a.endsWith('.local'))
  const version = ip ? (ip.includes(':') ? ' · IPv6' : ' · IPv4') : ''
  const viaStun = local.candidateType !== 'host' || remote?.candidateType !== 'host'
  return `WebRTC direkt${viaStun ? ' (durch NAT per STUN)' : ''}${version}`
}

// Hat dieses Gerät IPv6 ins Internet? (api6.ipify.org ist nur per IPv6 erreichbar)
let myIpv6 = 'IPv6 wird geprüft…'
fetch('https://api6.ipify.org', { signal: AbortSignal.timeout(5000) })
  .then(r => r.ok ? 'IPv6 ✓' : 'kein IPv6', () => 'kein IPv6')
  .then(v => { myIpv6 = v; dbg(`IPv6-Check: ${v}`); updateStatus() })

async function updateStatus() {
  const rtc = room?.getPeers() ?? {}
  const alive = id => id in rtc || Date.now() - (nostrSeen[id] ?? 0) < 45000
  for (const id in names) if (!alive(id)) {
    log(`${names[id]} hat den Raum verlassen`, 'sys')
    dbg(`${names[id]}: seit 45 s kein Lebenszeichen, entfernt`)
    delete names[id]; delete paths[id]
  }
  const rows = await Promise.all(Object.keys(names).map(async id => {
    const path = id in rtc ? await pathOf(rtc[id]) : 'über Nostr-Relay'
    if (paths[id] !== path) dbg(`${names[id]}: Weg ist jetzt „${path}“`)
    paths[id] = path
    return `${names[id]}: ${path}`
  }))
  const relays = sockets.filter(r => r.ws.readyState === 1).length
  $('status').textContent = `Raum „${ROOM}“ · ${relays}/${RELAYS.length} Nostr-Relays · Dein Gerät: ${myIpv6}${ONLY_NOSTR ? ' · WebRTC aus (Test)' : ''}`
  $('peers').textContent = rows.join('\n') || 'Noch keine anderen Peers'
}

$('join').onsubmit = e => {
  e.preventDefault()
  myName = $('nick').value.trim()

  if (!ONLY_NOSTR) {
    room = joinRoom({ appId: 'webchat-poc', ...(TURN.length && { turnConfig: TURN }) }, ROOM)
    msg = room.makeAction('msg')
    hello = room.makeAction('hello')
    // Neuen Peers den eigenen Namen schicken
    room.onPeerJoin = id => { dbg(`WebRTC: Verbindung zu ${id} steht`); hello.send(myName, { target: id }) }
    room.onPeerLeave = id => { dbg(`WebRTC: Verbindung zu ${names[id] ?? id} getrennt`); updateStatus() }
    hello.onMessage = (name, { peerId }) => { addPeer(peerId, name); updateStatus() }
    msg.onMessage = (m, { peerId }) => receive(m, peerId, 'WebRTC')
  }
  dbg(`Beigetreten: Raum „${ROOM}“ als ${myName} (${selfId})${ONLY_NOSTR ? ', WebRTC aus' : ''}`)

  sockets = RELAYS.map(connectRelay)
  // Lebenszeichen über Nostr, damit wir auch Peers ohne WebRTC-Verbindung kennen
  setInterval(() => nostrSend({ t: 'hi' }), 15000)
  setTimeout(() => nostrSend({ t: 'hi' }), 2000)
  setInterval(updateStatus, 3000)

  $('join').hidden = true
  $('chat').hidden = false
  log(`Du bist „${myName}“ (${selfId}). Warte auf andere Peers…`, 'sys')
  updateStatus()
  $('text').focus()
}

$('send').onsubmit = e => {
  e.preventDefault()
  const m = { id: crypto.randomUUID(), text: $('text').value }
  seenIds.add(m.id)
  const rtc = room?.getPeers() ?? {}
  if (msg && Object.keys(rtc).length) { msg.send(m); dbg(`Nachricht per WebRTC an ${Object.keys(rtc).length} Peer(s) gesendet`) }
  // Über Nostr nur, wenn jemand nicht per WebRTC erreichbar ist
  if (Object.keys(names).some(id => !(id in rtc))) nostrSend({ t: 'msg', ...m })
  log([myName, m.text], 'me')
  $('text').value = ''
}
</script>
</body>
</html>
